name: build

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Manifest URL to bake into the build
        required: false
        default: https://files.project97.life/release/manifest.json

# write, not read: the bundles are attached to a draft RELEASE rather than uploaded as Actions
# artifacts, which count against a per-account quota that silently killed two releases.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Created once, up front, so the parallel build jobs do not race to create the same release.
  prepare:
    if: github.repository == 'alexredchili-bit/project97-launcher'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - id: draft
        name: Open the draft release the bundles attach to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; the bundles will replace its assets"
          else
            gh release create "$tag" --draft --title "$tag" \
              --notes "Launcher $version, built by the build workflow from $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            bundles: nsis
            args: ""
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
            args: ""
          - os: macos-14
            name: macos
            bundles: dmg,app
            args: --target universal-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri will not bundle without a key; the sign job re-signs the attested bundles with the real one.
      - name: Make a throwaway updater key
        shell: bash
        run: |
          cargo tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/throwaway.key" >> "$GITHUB_ENV"

      - name: Build
        working-directory: src-tauri
        shell: bash
        env:
          PLZ_MANIFEST_URL_BAKED: ${{ inputs.manifest_url || 'https://files.project97.life/release/manifest.json' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$TAURI_SIGNING_PRIVATE_KEY_PATH")"
          cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - id: bundles
        name: Collect the bundles
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*release/bundle/*' \
            \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp {} out/ \;
          if [ -z "$(ls -A out)" ]; then
            echo "::error::the build produced no bundles"
            exit 1
          fi
          ls -la out

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: out/*

      - name: Attach the bundles to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" --clobber out/*

  sign:
    needs: [prepare, build]
    uses: ./.github/workflows/sign-updater.yml
    secrets: inherit
    with:
      tag: ${{ needs.prepare.outputs.tag }}
