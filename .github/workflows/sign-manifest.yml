name: sign-manifest

on:
  workflow_dispatch:
    inputs:
      build:
        description: Payload build to sign. Its payload-build-N release must carry the payload workflow's attestation.
        required: true
      workshop_updated:
        description: Workshop publish time (epoch seconds) the manifest records
        required: true
      commit:
        description: The commit this run must be on. Any other fails the run.
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: sign-manifest
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'alexredchili-bit/project97-launcher'
    runs-on: ubuntu-24.04
    environment: release
    env:
      BUILD: ${{ inputs.build }}
      WORKSHOP_UPDATED: ${{ inputs.workshop_updated }}
      WANT_COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build must be a number, got '$BUILD'"; exit 1; }
          [[ "$WORKSHOP_UPDATED" =~ ^[0-9]+$ ]] || { echo "::error::workshop_updated must be epoch seconds"; exit 1; }
          [[ "$WANT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character sha"; exit 1; }
          if [ "$GITHUB_SHA" != "$WANT_COMMIT" ]; then
            echo "::error::this run is on $GITHUB_SHA, not the requested $WANT_COMMIT"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Take the payload only from the payload workflow's attested release
        shell: pwsh
        run: ./tools/ci-payload.ps1 -Build $env:BUILD -Repo $env:GITHUB_REPOSITORY

      - name: Sign the manifest
        env:
          PLZ_MANIFEST_SIGNING_KEY: ${{ secrets.PLZ_MANIFEST_SIGNING_KEY }}
        run: node tools/make-manifest.mjs --build "$BUILD" --workshop-updated "$WORKSHOP_UPDATED" --out signed

      - name: Check the signature against the key the launcher pins
        run: |
          key=$(grep -oP 'PUBLIC_KEY_HEX:\s*&str\s*=\s*"\K[0-9a-fA-F]{64}' src-tauri/src/payload.rs)
          node tools/verify-manifest.mjs signed/manifest.json signed/manifest.json.sig "$key"
          sha256sum signed/manifest.json signed/manifest.json.sig

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: signed/manifest.json

      - name: Attach the signed manifest to the payload-build-N release
        run: gh release upload "payload-build-$BUILD" --clobber signed/manifest.json signed/manifest.json.sig
